[package]
name = "alloy_config"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
config = { version = "0.15", features = ["json", "toml", "yaml", "ini", "ron", "json5", "async"] }
napi = { version = "3", features = ["serde-json", "async"] }
napi-derive = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2"
